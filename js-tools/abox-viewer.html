<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DHC A-Box — Graph Viewer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background: #1e293b; color: #e2e8f0; overflow: hidden; }
    header { position: absolute; top: 0; left: 0; right: 0; height: 40px; box-sizing: border-box; padding: 8px 16px; background: #0f172a; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #334155; z-index: 10; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    header .meta { font-size: 12px; color: #94a3b8; }
    header label { font-size: 12px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
    header select, header button { font: 12px system-ui, sans-serif; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 2px 8px; }
    header button { cursor: pointer; }
    header button:hover { background: #334155; }
    header .status { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
    header .status.ok    { background: #064e3b; color: #6ee7b7; }
    header .status.warn  { background: #78350f; color: #fcd34d; }
    header .status.error { background: #7f1d1d; color: #fca5a5; }

    #graph-host { position: absolute; top: 40px; left: 0; right: 300px; bottom: 180px; }
    #inspector  { position: absolute; top: 40px; right: 0; width: 300px; bottom: 180px; box-sizing: border-box;
                  background: #0f172a; border-left: 1px solid #334155; padding: 12px 14px; overflow: auto; font-size: 12px; }
    #inspector h2 { font-size: 13px; margin: 0 0 4px; word-break: break-word; }
    #inspector .curie { font: 11px ui-monospace, Menlo, Consolas, monospace; color: #94a3b8; word-break: break-all; }
    #inspector .sect { margin-top: 12px; }
    #inspector .sect-h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin-bottom: 4px; }
    #inspector table { width: 100%; border-collapse: collapse; }
    #inspector td { padding: 2px 0; vertical-align: top; font: 11px ui-monospace, Menlo, Consolas, monospace; }
    #inspector td.k { color: #94a3b8; padding-right: 8px; white-space: nowrap; }
    #inspector td.v { color: #e2e8f0; word-break: break-word; }
    #inspector .viol { background: #7f1d1d; color: #fecaca; border-radius: 4px; padding: 8px; margin-bottom: 6px; }
    #inspector .viol .shape { font-weight: 600; }
    #inspector .empty { color: #64748b; font-style: italic; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

    #legend { position: absolute; left: 12px; top: 52px; z-index: 5; background: rgba(15,23,42,.85); border: 1px solid #334155;
              border-radius: 6px; padding: 8px 10px; font-size: 11px; line-height: 1.7; min-width: 168px; }
    #legend .row { cursor: pointer; user-select: none; border-radius: 3px; padding: 0 4px; margin: 0 -4px; display: flex; align-items: center; }
    #legend .row:hover { background: #1e293b; }
    #legend .row.off { opacity: .35; text-decoration: line-through; }
    #legend .row .n { margin-left: auto; color: #64748b; padding-left: 10px; }
    #legend .grp { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin: 6px 0 2px; }
    #legend .grp:first-child { margin-top: 0; }
    #legend .hint { color: #64748b; font-size: 10px; margin-top: 4px; border-top: 1px solid #334155; padding-top: 4px; }
    /* Node glyphs mirror the 3-D geometry: equipment is a box, everything else
       a sphere, so the legend and the canvas agree at a glance. */
    .glyph { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: middle; flex: none; }
    .glyph.sphere { border-radius: 50%; }
    .glyph.hollow { background: none !important; border: 1px dashed #64748b; }
    .edge { display: inline-block; width: 14px; height: 0; margin-right: 6px; vertical-align: middle; flex: none; }
    #log { position: absolute; left: 0; right: 0; bottom: 0; height: 180px; box-sizing: border-box; padding: 8px 16px; background: #0f172a;
           border-top: 1px solid #334155; overflow: auto; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
    #log .line { white-space: pre-wrap; margin: 0 0 2px; }
    #log .err  { color: #fca5a5; }
    #log .info { color: #94a3b8; }
    #log .ok   { color: #6ee7b7; }
    #log .warn { color: #fcd34d; }

    /* Modelling: the vocabulary catalog + property descriptions in the inspector. */
    #inspector .desc { color: #cbd5e1; margin: 2px 0 0; font-size: 11px; line-height: 1.5; }
    #inspector .cat-h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin: 12px 0 4px; }
    #inspector .term { padding: 3px 4px; margin: 0 -4px; border-radius: 3px; cursor: pointer; }
    #inspector .term:hover { background: #1e293b; }
    #inspector .term .tc { font: 11px ui-monospace, Menlo, Consolas, monospace; color: #e2e8f0; }
    #inspector .term .td { color: #94a3b8; font-size: 10px; display: block; }
    #inspector .prop-desc { color: #64748b; font-size: 10px; display: block; }

    /* Designing: the norms & good-practices modal. */
    #modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: none; }
    #norms-modal { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 21; display: none;
                   width: 460px; max-height: 70vh; overflow: auto; background: #0f172a; border: 1px solid #334155;
                   border-radius: 8px; padding: 16px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    #norms-modal h2 { font-size: 14px; margin: 0 0 4px; }
    #norms-modal p.sub { font-size: 11px; color: #94a3b8; margin: 0 0 12px; }
    #norms-modal .norm-h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin: 12px 0 4px; }
    #norms-modal label.ed { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; cursor: pointer; }
    #norms-modal label.ed .inforce { color: #6ee7b7; font-size: 10px; }
    #norms-modal .actions { margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end; }
    #norms-modal .empty { color: #64748b; font-style: italic; font-size: 11px; }
  </style>
  <!-- 3d-force-graph 1.79.1 — vendored UMD, three.js inlined. No network at
       runtime, by design: the Blockly harnesses this is modelled on load their
       library from unpkg and silently require internet.

       three.module.min.js (r170) is vendored SEPARATELY and deliberately. The
       UMD bundle inlines three r180 but exports only ForceGraph3D, so there is
       no way to reach a geometry constructor through it — and custom node
       shapes and particle shapes need one. Two three instances therefore
       coexist. That is safe here for a specific reason, not by luck: three
       identifies types with duck-typing flags (isObject3D / isMesh /
       isBufferGeometry) and material.type strings rather than instanceof,
       exactly so foreign objects interoperate. An r170 Mesh is rendered fine by
       the r180 renderer. Verified on screen, not assumed.

       Classic scripts run before deferred module scripts, so ForceGraph3D is
       already global by the time the module below executes. -->
  <script src="./vendor/3d-force-graph.min.js"></script>
</head>
<body>
  <header>
    <h1>DHC A-Box</h1>
    <label>model
      <select id="source-select"></select>
    </label>
    <label>mode
      <select id="mode-select">
        <option value="modelling">modelling</option>
        <option value="designing">designing</option>
      </select>
    </label>
    <label>colour
      <select id="colour-mode"></select>
    </label>
    <label>group
      <select id="group-select" title="Draw translucent hulls around zones / circuits / assemblies; click a group in the legend to collapse it">
        <option value="none">none</option>
        <option value="zone">zone</option>
        <option value="circuit">circuit</option>
        <option value="composition">composition</option>
      </select>
    </label>
    <button id="norms" title="Choose which norms/editions to analyse against" style="display:none">Norms…</button>
    <button id="symbols" title="Toggle 3-D primitives ↔ flat symbols">symbols: 3-D</button>
    <button id="fit">Fit</button>
    <button id="reset-filter" title="Show all">All</button>
    <span id="status" class="status">loading…</span>
  </header>

  <div id="graph-host"></div>
  <div id="legend"></div>
  <aside id="inspector"><p class="empty">Click a node to inspect it.</p></aside>
  <div id="log"></div>
  <div id="modal-backdrop"></div>
  <div id="norms-modal"></div>

  <script type="module">
    import * as THREE from './vendor/three.module.min.js';

    // House palette — docs/design/patterns/semantic-views.md. Same map the
    // Modeler uses, so an A-Box reads like the ontology graph.
    const VIEW_COLOURS = {
      spatial:    '#22c55e',
      building:   '#f59e0b',
      electrical: '#3b82f6',
      plumbing:   '#06b6d4',
      heating:    '#ef4444',
      network:    '#a855f7',
      governance: '#f97316',
      automation: '#ec4899',
    };
    const SHARED   = '#e5e7eb';   // cross-view / unannotated
    const VIOLATION = '#ef4444';  // a node the C-Box rejected

    // Namespace of the node's rdf:type — i.e. which standard defines it.
    // NOT the namespace of the individual's own IRI: every A-Box individual is
    // an ex:, so that colours all 45 nodes identically and says nothing. By
    // type you get dhc 29 / brick 10 / rec 3 / s223 3 — the "dhc: only fills
    // gaps" principle, made visible.
    const NS_COLOURS = { dhc: '#3b82f6', brick: '#22c55e', rec: '#f59e0b', s223: '#a855f7', unit: '#06b6d4', other: '#818cf8' };

    // Compliance — a prototype of what the Designer will show properly.
    //
    // Nothing here is declared by the model: build-abox.mjs validates the A-Box
    // against EVERY norm edition that has shapes and compares the verdicts.
    // 'gap' means it passed an older edition and failed the newest — a pool
    // wired to NF C 15-100:2002 is legal and stays legal, until you add a
    // circuit, at which point the current edition applies to the work. Not
    // broken, but not free to touch.
    //
    // TWO CHANNELS. Colour is the verdict against the best edition we hold.
    // Opacity is whether we hold the edition in force at all. Those are
    // different claims — "the rule says no" versus "we have no rule" — and this
    // viewer conflated them once already, burying the one state an owner can
    // act on under a field of things nobody had checked.
    const COMPLIANCE_COLOURS = {
      ok:        '#22c55e',
      gap:       '#eab308',
      danger:    '#ef4444',
      unchecked: '#64748b',   // always ghosted — see nodeObject()
    };
    const COMPLIANCE_HELP = {
      ok:        'passes the newest edition we hold rules for',
      gap:       'passes an older edition, fails the current one — lawful as built; changing it triggers the current one',
      danger:    'fails even the oldest edition we hold — it was never compliant',
      unchecked: 'no shape in any edition targets this class — nothing looked at it',
    };
    const GHOST_HELP = 'ghosted = we cannot speak to the edition in force (no shapes for it, or nothing targets this class). Our gap, not the building\'s.';

    // How each kind of relationship is drawn. Flow and control get moving
    // particles because they are the two that describe something *happening*:
    // energy moving, and commands being issued. Spatial and structural describe
    // arrangement, and stay still.
    const EDGE_STYLE = {
      spatial:    { colour: '#22c55e', width: 0.3, particles: 0, help: 'where a thing is' },
      structural: { colour: '#64748b', width: 0.8, particles: 0, help: 'what a thing is made of / belongs to' },
      flow:       { colour: '#3b82f6', width: 1.6, particles: 4, help: 'energy path — moving dots' },
      control:    { colour: '#ec4899', width: 1.2, particles: 2, help: 'commands — moving blocks' },
      other:      { colour: '#f97316', width: 0.6, particles: 0, help: 'unclassified predicate — see EDGE_CLASS in build-abox.mjs' },
    };
    const styleOf = (l) => EDGE_STYLE[l.kind] ?? EDGE_STYLE.other;

    // Shared across every particle instance — three is happy to reuse geometry
    // and material, and the alternative allocates a mesh per particle per frame.
    const FLOW_GEOM = new THREE.SphereGeometry(1.1, 8, 6);
    const FLOW_MAT  = new THREE.MeshLambertMaterial({ color: EDGE_STYLE.flow.colour });
    const CTRL_GEOM = new THREE.BoxGeometry(2.2, 2.2, 2.2);
    const CTRL_MAT  = new THREE.MeshLambertMaterial({ color: EDGE_STYLE.control.colour });
    const particleObject = (l) =>
      l.kind === 'control' ? new THREE.Mesh(CTRL_GEOM, CTRL_MAT) : new THREE.Mesh(FLOW_GEOM, FLOW_MAT);

    // ── glyph rendering ──────────────────────────────────────────────────────
    // Per-class symbol shapes. n.glyph is computed in build-abox.mjs from the
    // subclass hierarchy (bulb for a luminaire, a DIN module for a breaker, …).
    // Two hard constraints shape this code:
    //   1. Offline — every shape is a three primitive or a <canvas> drawing; no
    //      SVG, GLTF or network. Only the ESM three (this import) exposes the
    //      geometry constructors; the UMD bundle exports only ForceGraph3D.
    //   2. Perf — the old nodeObject allocated a fresh geometry AND material per
    //      node (soda_brick = 1695 of each). Here geometry is built ONCE per
    //      glyph and shared; the per-node size bump is a mesh.scale, not a new
    //      geometry; materials come from a ~20-entry cache keyed colour|opacity.
    const R = 3.2;   // base radius; violation nodes scale up via mesh.scale
    const box  = (x, y, z) => new THREE.BoxGeometry(x, y, z);
    const cyl  = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
    // One geometry (or a Group template for composites) per glyph, built lazily.
    const GLYPH_GEOM = {
      bulb:       () => new THREE.SphereGeometry(R * 0.95, 10, 8),
      socket:     () => cyl(R, R, R * 0.4, 14),
      breaker:    () => box(R * 0.7, R * 1.9, R * 0.7),
      panel:      () => box(R * 2.2, R * 1.7, R * 0.6),
      meter:      () => cyl(R * 0.85, R * 0.85, R * 1.1, 12),
      inverter:   () => box(R * 1.4, R * 1.3, R * 0.8),
      battery:    () => cyl(R * 0.7, R * 0.7, R * 1.7, 12),
      pv:         () => box(R * 1.9, R * 0.22, R * 1.2),
      charger:    () => cyl(R * 0.7, R * 0.9, R * 1.9, 6),
      delivery:   () => new THREE.OctahedronGeometry(R * 1.15),   // "double cone" grid source
      busbar:     () => box(R * 2.6, R * 0.4, R * 0.4),
      circuit:    () => new THREE.TorusGeometry(R * 0.9, R * 0.34, 8, 16),
      wire:       () => cyl(R * 0.22, R * 0.22, R * 2, 6),
      port:       () => new THREE.TetrahedronGeometry(R * 0.95),
      controller: () => new THREE.OctahedronGeometry(R * 0.95),
      sensor:     () => new THREE.SphereGeometry(R * 0.6, 8, 6),
      room:       () => box(R * 2, R * 0.3, R * 2),               // floor plate
      appliance:  () => box(R * 1.3, R * 1.3, R * 1.3),
      box:        () => box(R * 1.7, R * 1.7, R * 1.7),           // legacy equipment box
      sphere:     () => new THREE.SphereGeometry(R, 12, 8),       // fallback
      // Composite: a house = body + prism roof. Returns a Group TEMPLATE whose
      // children's materials are replaced on clone.
      building: () => {
        const g = new THREE.Group();
        const body = new THREE.Mesh(box(R * 1.6, R * 1.1, R * 1.6), null);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(R * 1.25, R * 0.9, 4), null);
        roof.position.y = R * 1.0; roof.rotation.y = Math.PI / 4;
        g.add(body, roof); g.userData.template = true;
        return g;
      },
    };
    const glyphCache = new Map();
    const geomFor = (glyph) => {
      if (!glyphCache.has(glyph)) glyphCache.set(glyph, (GLYPH_GEOM[glyph] ?? GLYPH_GEOM.sphere)());
      return glyphCache.get(glyph);
    };

    // Material cache — ~20 combinations at most. bulb is emissive so it reads as
    // a light source; that variant is keyed separately.
    const matCache = new Map();
    const material = (hex, opacity, emissive) => {
      const key = `${hex}|${opacity}|${emissive ? 1 : 0}`;
      if (!matCache.has(key)) {
        matCache.set(key, new THREE.MeshLambertMaterial({
          color: hex, transparent: true, opacity,
          ...(emissive ? { emissive: hex, emissiveIntensity: 0.6 } : {}),
        }));
      }
      return matCache.get(key);
    };

    // Flat-symbol mode: each glyph drawn once on a <canvas> in white (so it can
    // be tinted per node via SpriteMaterial.color), cached as a CanvasTexture.
    const symbolTexCache = new Map();
    const drawSymbol = (glyph) => {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const x = c.getContext('2d');
      x.strokeStyle = x.fillStyle = '#fff'; x.lineWidth = 4; x.lineCap = 'round';
      const C = 32, r = 20;
      const circle = (rr = r) => { x.beginPath(); x.arc(C, C, rr, 0, 7); x.stroke(); };
      const rect = (w, h) => x.strokeRect(C - w / 2, C - h / 2, w, h);
      const line = (x1, y1, x2, y2) => { x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y2); x.stroke(); };
      switch (glyph) {
        case 'bulb': circle(); line(20, 20, 44, 44); line(44, 20, 20, 44); break;      // ⊗ lamp (IEC)
        case 'socket': circle(); x.beginPath(); x.arc(24, 32, 3, 0, 7); x.arc(40, 32, 3, 0, 7); x.fill(); break;
        case 'breaker': rect(20, 40); line(22, 42, 42, 22); break;                     // switch in a module
        case 'panel': rect(44, 34); line(C, 15, C, 49); break;
        case 'meter': circle(); line(C, C, 46, 20); break;                             // dial + needle
        case 'inverter': rect(40, 40); line(14, 46, 30, 22); line(34, 42, 50, 18); break; // ~/=
        case 'battery': line(20, 22, 20, 42); line(28, 16, 28, 48); line(38, 22, 38, 42); line(46, 16, 46, 48); break;
        case 'pv': rect(44, 30); line(24, 17, 24, 47); line(40, 17, 40, 47); break;    // panel grid
        case 'charger': rect(24, 40); line(40, 24, 48, 24); line(40, 32, 50, 32); break;
        case 'delivery': line(C, 10, C, 34); line(20, 22, C, 34); line(44, 22, C, 34); circle(8); break;
        case 'busbar': line(10, C, 54, C); line(20, 24, 20, 40); line(44, 24, 44, 40); break;
        case 'circuit': circle(18); break;
        case 'wire': line(12, 44, 52, 20); break;
        case 'port': x.beginPath(); x.moveTo(C, 14); x.lineTo(48, 46); x.lineTo(16, 46); x.closePath(); x.stroke(); break;
        case 'controller': x.beginPath(); x.moveTo(C, 12); x.lineTo(52, 32); x.lineTo(C, 52); x.lineTo(12, 32); x.closePath(); x.stroke(); break;
        case 'sensor': circle(10); break;
        case 'building': line(14, 50, 14, 30); line(50, 50, 50, 30); line(14, 30, C, 14); line(50, 30, C, 14); line(14, 50, 50, 50); break;
        case 'room': rect(40, 40); break;
        default: circle(14);
      }
      return new THREE.CanvasTexture(c);
    };
    const symbolTex = (glyph) => {
      if (!symbolTexCache.has(glyph)) symbolTexCache.set(glyph, drawSymbol(glyph));
      return symbolTexCache.get(glyph);
    };
    const spriteMatCache = new Map();
    const spriteMaterial = (glyph, hex, opacity) => {
      const key = `${glyph}|${hex}|${opacity}`;
      if (!spriteMatCache.has(key)) {
        spriteMatCache.set(key, new THREE.SpriteMaterial({
          map: symbolTex(glyph), color: hex, transparent: true, opacity, depthWrite: false,
        }));
      }
      return spriteMatCache.get(key);
    };

    // 'solid' (3-D primitives) | 'sprite' (flat symbols). ?symbols=flat is linkable.
    let glyphMode = ['flat', 'sprite'].includes(new URLSearchParams(location.search).get('symbols')) ? 'sprite' : 'solid';

    // The node's own object. Shares geometry + material; the per-node size bump
    // for a violation is a mesh scale, never a new geometry.
    const nodeObject = (n) => {
      const ghost = colourMode === 'compliance' && ghostedOf(n);
      const opacity = ghost ? (complianceOf(n) === 'unchecked' ? 0.1 : 0.35) : 0.95;
      const colour = nodeColour(n);
      const glyph = n.glyph ?? (n.shape === 'box' ? 'appliance' : 'sphere');
      let obj;
      if (glyphMode === 'sprite') {
        obj = new THREE.Sprite(spriteMaterial(glyph, colour, opacity));
        obj.scale.setScalar(n.violations?.length ? 12 : 9);
        return obj;
      }
      const g = geomFor(glyph);
      const mat = material(colour, opacity, glyph === 'bulb');
      if (g.userData?.template) {                 // composite Group (building)
        obj = g.clone();
        obj.traverse((o) => { if (o.isMesh) o.material = mat; });
      } else {
        obj = new THREE.Mesh(g, mat);
      }
      if (n.violations?.length) obj.scale.setScalar(1.55);
      if (n.isSuper) obj.scale.multiplyScalar(1.9);   // a collapsed group reads bigger
      return obj;
    };

    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const log = (msg, cls = 'info') => {
      const d = document.createElement('div');
      d.className = 'line ' + cls; d.textContent = msg;
      logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
    };
    const setStatus = (t, c) => { statusEl.textContent = t; statusEl.className = 'status ' + c; };

    async function fetchJson(p) {
      const r = await fetch(p);
      if (!r.ok) throw new Error(`${p}: HTTP ${r.status} — run scripts/preview-abox.sh (it builds these)`);
      return r.json();
    }

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // ?colour=compliance&model=<slug> — so a particular view is linkable, and
    // so an automated check can open the mode it wants to assert on.
    const params = new URLSearchParams(location.search);
    let graph = null, report = null, vocab = null, Graph = null;
    // Two audiences, two modes. MODELLING is for reading the model — classes,
    // properties, descriptions, the vocabulary — and never shows compliance.
    // DESIGNING is for analysing against a chosen set of norm editions; that is
    // the ONLY place non-compliance appears. Colour options differ per mode.
    let mode = params.get('mode') === 'designing' ? 'designing' : 'modelling';
    const COLOUR_OPTS = {
      modelling: [['view', 'design view'], ['ns', 'standard (rdf:type ns)']],
      designing: [['compliance', 'compliance'], ['view', 'design view']],
    };
    const paramColour = params.get('colour');
    let colourMode = COLOUR_OPTS[mode].some(([v]) => v === paramColour) ? paramColour : COLOUR_OPTS[mode][0][0];
    let hidden = new Set();        // node legend buckets toggled off
    let hiddenKinds = new Set();   // edge kinds toggled off

    // Editions the Designing picker analyses against. Defaults to all editions
    // that have shapes; a subset recomputes each node's displayed compliance.
    let selectedEditions = new Set();
    let editionOrder = [];          // oldest→newest, from report.editions (runs order)
    let inForceByNorm = new Map();  // norm curie → its edition-in-force curie

    // Displayed compliance. In modelling it is never shown. In designing with the
    // full edition set it reproduces the build's verdict exactly; with a subset it
    // is recomputed CLIENT-SIDE for display only — the built verdict is never
    // rewritten. Same logic as build-abox.mjs: fails the oldest selected edition
    // that targets it ⇒ danger; passes that, fails the newest ⇒ gap (grandfathered
    // against the chosen norms); none selected target it ⇒ unchecked.
    const recompute = (n) => {
      const targeted = (n.targetedEditions ?? []).filter((e) => selectedEditions.has(e));
      if (!targeted.length) return { compliance: 'unchecked', ghosted: true };
      targeted.sort((a, b) => editionOrder.indexOf(a) - editionOrder.indexOf(b));
      const viol = new Set(n.violatedEditions ?? []);
      const oldest = targeted[0], newest = targeted[targeted.length - 1];
      const compliance = viol.has(oldest) ? 'danger' : viol.has(newest) ? 'gap' : 'ok';
      // On the full set, carry the build's ghosting (it encodes "in-force edition
      // has no shapes", which the node arrays can't see). On a subset, only the
      // unchecked case ghosts.
      const ghosted = selectedEditions.size === editionOrder.length ? !!n.ghosted : false;
      return { compliance, ghosted };
    };
    const complianceOf = (n) => (mode === 'designing' ? recompute(n).compliance : n.compliance);
    const ghostedOf    = (n) => (mode === 'designing' ? recompute(n).ghosted    : n.ghosted);

    // Which legend bucket a node falls in, for the active colour mode.
    const keyOf = (n) =>
      colourMode === 'ns'           ? ((n.types[0] ?? '').split(':')[0] || 'other')
      : colourMode === 'compliance' ? complianceOf(n)
      : (n.designView ?? 'shared');

    const paletteFor = (m) =>
      m === 'ns' ? NS_COLOURS : m === 'compliance' ? COMPLIANCE_COLOURS : { ...VIEW_COLOURS, shared: SHARED };

    const nodeColour = (n) => {
      // Violations are a compliance signal — they only tint a node in DESIGNING's
      // compliance colouring, never in modelling (where compliance is suppressed).
      if (mode === 'designing' && colourMode !== 'compliance' && n.violations?.length) return VIOLATION;
      return paletteFor(colourMode)[keyOf(n)] ?? SHARED;
    };

    const visible = (n) => !hidden.has(keyOf(n));

    // ── Groups ────────────────────────────────────────────────────────────
    // Membership comes from the edges. Each definition maps a predicate to the
    // (container, member) pair — direction matters, so a `locatedIn` and an
    // `isLocationOf` both point the same way. A group is a container plus every
    // node it contains; groups of one are dropped (nothing to draw or collapse).
    let groupBy = ['zone', 'circuit', 'composition'].includes(params.get('group')) ? params.get('group') : 'none';
    let groups = new Map();        // container id → { container, members:Set, tint }
    let collapsed = new Set();     // container ids currently collapsed to a super-node
    let hullMeshes = new Map();    // container id → translucent hull Mesh in the scene
    const GROUP_TINTS = ['#38bdf8', '#a78bfa', '#f472b6', '#34d399', '#fbbf24', '#fb7185', '#60a5fa', '#c084fc'];
    const idOf = (x) => x?.id ?? x;
    const GROUP_DEFS = {
      zone: {
        'rec:locatedIn':    (l) => [idOf(l.target), idOf(l.source)],
        'brick:hasLocation':(l) => [idOf(l.target), idOf(l.source)],
        'rec:isLocationOf': (l) => [idOf(l.source), idOf(l.target)],
      },
      circuit: {
        's223:hasMember':   (l) => [idOf(l.source), idOf(l.target)],
      },
      composition: {
        'brick:hasPart':    (l) => [idOf(l.source), idOf(l.target)],
        's223:contains':    (l) => [idOf(l.source), idOf(l.target)],
        'rec:includes':     (l) => [idOf(l.source), idOf(l.target)],
        'rec:hasPart':      (l) => [idOf(l.source), idOf(l.target)],
        'brick:isPartOf':   (l) => [idOf(l.target), idOf(l.source)],
      },
    };

    function computeGroups() {
      groups = new Map();
      if (groupBy === 'none' || !graph) return;
      const def = GROUP_DEFS[groupBy];
      for (const l of graph.links) {
        const dir = def[l.property];
        if (!dir) continue;
        const [container, member] = dir(l);
        if (!container || !member || container === member) continue;
        let grp = groups.get(container);
        if (!grp) { grp = { container, members: new Set([container]) }; groups.set(container, grp); }
        grp.members.add(member);
      }
      let i = 0;
      for (const [cid, grp] of [...groups]) {
        if (grp.members.size < 2) { groups.delete(cid); continue; }
        grp.tint = GROUP_TINTS[i++ % GROUP_TINTS.length];
      }
    }

    const nodeById = (id) => graph.nodes.find((n) => n.id === id);

    // A collapsed group becomes one node. Its edition arrays are the UNION of its
    // members' — so the group is 'ok' only if every member is, and worst-wins
    // falls out of the same recompute() the individual nodes use.
    function makeSuper(cid, grp) {
      const c = nodeById(cid) ?? { curie: cid, label: cid, types: [], typeIris: [], designView: 'shared' };
      const members = [...grp.members].map(nodeById).filter(Boolean);
      const targeted = new Set(), violated = new Set();
      let anyGhost = false;
      for (const m of members) {
        (m.targetedEditions ?? []).forEach((e) => targeted.add(e));
        (m.violatedEditions ?? []).forEach((e) => violated.add(e));
        anyGhost = anyGhost || !!m.ghosted;
      }
      return {
        id: 'grp:' + cid, curie: c.curie, label: `${c.label} +${grp.members.size - 1}`,
        types: c.types, typeIris: c.typeIris, designView: c.designView,
        literals: [], violations: [], glyph: 'panel', shape: 'box',
        isSuper: true, memberCount: grp.members.size, compliance: 'unchecked',
        ghosted: anyGhost, targetedEditions: [...targeted], violatedEditions: [...violated],
      };
    }

    // The graph actually fed to the renderer: visibility filter + hidden edge
    // kinds + collapse of any collapsed groups (members folded into a super-node,
    // internal links dropped, external links re-pointed and de-duplicated).
    function displayGraph() {
      const active = new Set([...collapsed].filter((c) => groups.has(c)));
      const toSuper = new Map();
      const superNodes = [];
      for (const cid of active) {
        const grp = groups.get(cid);
        for (const m of grp.members) toSuper.set(m, 'grp:' + cid);
        superNodes.push(makeSuper(cid, grp));
      }
      const baseNodes = graph.nodes.filter((n) => visible(n) && !toSuper.has(n.id));
      const nodes = [...baseNodes, ...superNodes];
      const ids = new Set(nodes.map((n) => n.id));
      const seen = new Set();
      const links = [];
      for (const l of graph.links) {
        if (hiddenKinds.has(l.kind)) continue;
        const s = toSuper.get(idOf(l.source)) ?? idOf(l.source);
        const t = toSuper.get(idOf(l.target)) ?? idOf(l.target);
        if (s === t || !ids.has(s) || !ids.has(t)) continue;
        const key = `${s}|${t}|${l.property}`;
        if (seen.has(key)) continue;
        seen.add(key);
        links.push({ ...l, source: s, target: t });
      }
      return { nodes, links };
    }

    function applyFilter() {
      const { nodes, links } = displayGraph();
      Graph.graphData({ nodes: nodes.map((n) => ({ ...n })), links: links.map((l) => ({ ...l })) });
      log(`filter → ${nodes.length}/${graph.nodes.length} nodes, ${links.length}/${graph.links.length} links`);
      rebuildHulls();
    }

    // A hull per NON-collapsed group: a translucent sphere the renderer never
    // raycasts (so it can't steal a node click), repositioned every engine tick
    // from the live member coordinates. Collapsed groups have no hull — they are
    // a node instead.
    function rebuildHulls() {
      if (!Graph?.scene) return;
      for (const m of hullMeshes.values()) Graph.scene().remove(m);
      hullMeshes.clear();
      if (groupBy === 'none') return;
      const geom = new THREE.SphereGeometry(1, 12, 8);
      for (const [cid, grp] of groups) {
        if (collapsed.has(cid)) continue;
        const mat = new THREE.MeshBasicMaterial({
          color: grp.tint, transparent: true, opacity: 0.1, depthWrite: false,
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.raycast = () => {};
        Graph.scene().add(mesh);
        hullMeshes.set(cid, mesh);
      }
      positionHulls();
    }

    function positionHulls() {
      if (!hullMeshes.size) return;
      const pos = new Map((Graph.graphData().nodes).map((n) => [n.id, n]));
      for (const [cid, mesh] of hullMeshes) {
        const pts = [...groups.get(cid).members].map((id) => pos.get(id)).filter((n) => n && Number.isFinite(n.x));
        if (pts.length < 2) { mesh.visible = false; continue; }
        mesh.visible = true;
        let cx = 0, cy = 0, cz = 0;
        for (const p of pts) { cx += p.x; cy += p.y; cz += p.z; }
        cx /= pts.length; cy /= pts.length; cz /= pts.length;
        let r = 0;
        for (const p of pts) r = Math.max(r, Math.hypot(p.x - cx, p.y - cy, p.z - cz));
        mesh.position.set(cx, cy, cz);
        mesh.scale.setScalar(r + 6);   // pad past the outermost member
      }
    }

    function renderLegend() {
      const el = document.getElementById('legend');
      const pal = paletteFor(colourMode);
      // Only buckets that actually occur — a legend of absent colours is noise.
      const present = new Set(graph.nodes.map(keyOf));
      const counts = {};
      for (const n of graph.nodes) counts[keyOf(n)] = (counts[keyOf(n)] || 0) + 1;
      // Most nodes in a bucket are one shape or the other; show that glyph so
      // the legend matches what is on the canvas.
      const shapeOf = (k) => graph.nodes.filter((n) => keyOf(n) === k)
        .filter((n) => n.shape === 'box').length * 2 >= counts[k] ? 'box' : 'sphere';

      const ghostCount = graph.nodes.filter((n) => ghostedOf(n)).length;
      const nodeRows = Object.entries(pal).filter(([k]) => present.has(k)).map(([k, c]) => `
        <div class="row ${hidden.has(k) ? 'off' : ''}" data-key="${k}" title="${esc(COMPLIANCE_HELP[k] ?? 'click to show/hide')}">
          <span class="glyph ${shapeOf(k) === 'sphere' ? 'sphere' : ''} ${colourMode === 'compliance' && k === 'unchecked' ? 'hollow' : ''}"
                style="background:${c}"></span>${k}<span class="n">${counts[k]}</span>
        </div>`).join('')
        // Ghosting is the second channel, so it gets its own row rather than
        // pretending to be a fifth colour. Not a filter — it cuts across all four.
        + (colourMode === 'compliance' && ghostCount ? `
        <div class="row" style="cursor:default;opacity:.75" title="${esc(GHOST_HELP)}">
          <span class="glyph hollow" style="background:#94a3b8;opacity:.35"></span>ghosted<span class="n">${ghostCount}</span>
        </div>` : '');

      const kinds = {};
      for (const l of graph.links) kinds[l.kind] = (kinds[l.kind] || 0) + 1;
      const edgeRows = Object.keys(EDGE_STYLE).filter((k) => kinds[k]).map((k) => `
        <div class="row edge-row ${hiddenKinds.has(k) ? 'off' : ''}" data-kind="${k}" title="${esc(EDGE_STYLE[k].help)}">
          <span class="edge" style="border-top:${Math.max(1, Math.round(EDGE_STYLE[k].width * 1.6))}px ${k === 'spatial' ? 'dashed' : 'solid'} ${EDGE_STYLE[k].colour}"></span>${k}<span class="n">${kinds[k]}</span>
        </div>`).join('');

      // Groups section — one row per group; the row IS the collapse control
      // (clicking a translucent hull in the scene would mean our own raycaster,
      // and this is unambiguous). "off" styling marks a collapsed group.
      let groupRows = '';
      if (groupBy !== 'none') {
        const rows = [...groups.values()].map((g) => {
          const c = graph.nodes.find((n) => n.id === g.container);
          const col = collapsed.has(g.container);
          return `<div class="row grp-row ${col ? 'off' : ''}" data-grp="${esc(g.container)}"
                       title="click to ${col ? 'expand' : 'collapse'} this ${groupBy}">
            <span class="glyph" style="background:${g.tint}"></span>${esc(c?.label ?? g.container)}<span class="n">${g.members.size}</span>
          </div>`;
        }).join('');
        groupRows = `<div class="grp">groups — ${groupBy}</div>`
          + (rows || `<div class="hint">no ${groupBy} groups in this model</div>`);
      }

      el.innerHTML = `<div class="grp">nodes — ${colourMode}</div>${nodeRows}`
                   + `<div class="grp">edges</div>${edgeRows}`
                   + groupRows
                   + `<div class="hint">click any row to filter${groupBy !== 'none' ? '; a group row collapses it' : ''}</div>`;

      el.querySelectorAll('.row[data-key]').forEach((r) => r.addEventListener('click', () => {
        const k = r.dataset.key;
        hidden.has(k) ? hidden.delete(k) : hidden.add(k);
        renderLegend(); applyFilter();
      }));
      el.querySelectorAll('.row[data-kind]').forEach((r) => r.addEventListener('click', () => {
        const k = r.dataset.kind;
        hiddenKinds.has(k) ? hiddenKinds.delete(k) : hiddenKinds.add(k);
        renderLegend(); applyFilter();
      }));
      el.querySelectorAll('.row[data-grp]').forEach((r) => r.addEventListener('click', () => {
        const c = r.dataset.grp;
        collapsed.has(c) ? collapsed.delete(c) : collapsed.add(c);
        renderLegend(); applyFilter();
      }));
    }

    // Vocabulary lookup — {label, comment, kind, designView} per curie, from
    // data/vocab.json (built from dhc-core + the annotation overlay).
    const vterm = (curie) => vocab?.get(curie) ?? null;
    const descOf = (curie) => vterm(curie)?.comment ?? '';
    const labelOf = (curie) => vterm(curie)?.label ?? '';

    function inspect(n) {
      const el = document.getElementById('inspector');
      if (!n) { renderCatalog(); return; }

      // Predicates this node uses: data properties (literal keys) + object
      // properties (its outgoing links). Shown with their vocabulary description.
      const litProps = Object.keys(n.literals || {});
      const objProps = [...new Set(graph.links
        .filter((l) => (l.source.id ?? l.source) === n.id)
        .map((l) => l.property))];
      const propRow = (p, val) => `
        <tr><td class="k">${esc(p)}</td><td class="v">${esc(val)}
          ${labelOf(p) ? `<span class="prop-desc">${esc(labelOf(p))}${descOf(p) ? ' — ' + esc(descOf(p)) : ''}</span>` : ''}
        </td></tr>`;

      const compliance = mode === 'designing' ? `
        <div class="sect">
          <div class="sect-h">compliance${selectedEditions.size !== editionOrder.length ? ' (selected norms)' : ''}</div>
          <div class="curie">
            <span class="glyph" style="background:${COMPLIANCE_COLOURS[complianceOf(n)]}"></span>${esc(complianceOf(n))}
            — ${esc(COMPLIANCE_HELP[complianceOf(n)])}
          </div>
          ${selectedEditions.size === editionOrder.length && n.complianceWhy ? `<div class="curie" style="margin-top:4px;color:#cbd5e1">${esc(n.complianceWhy)}</div>` : ''}
          ${ghostedOf(n) && complianceOf(n) !== 'unchecked' ? `<div class="curie" style="margin-top:4px;color:#94a3b8">ghosted — ${esc(GHOST_HELP)}</div>` : ''}
        </div>
        ${n.violations?.length ? `<div class="sect">
          <div class="sect-h">C-Box violations — by edition</div>
          ${n.violations.map((v) => `<div class="viol">
            <div class="shape">${esc(v.edition ?? v.profile)} · ${esc(v.shape || v.path || '(unnamed shape)')}</div>
            ${v.message ? `<div>${esc(v.message)}</div>` : ''}
          </div>`).join('')}
        </div>` : ''}` : '';

      el.innerHTML = `
        <h2><span class="dot" style="background:${nodeColour(n)}"></span>${esc(n.label)}</h2>
        <div class="curie">${esc(n.curie)}</div>
        <div class="sect">
          <div class="sect-h">class${n.types.length > 1 ? 'es' : ''}</div>
          ${n.types.map((t) => `<div class="term" style="cursor:default">
            <span class="tc">${esc(t)}</span>
            ${descOf(t) ? `<p class="desc">${esc(descOf(t))}</p>` : (labelOf(t) ? `<span class="td">${esc(labelOf(t))}</span>` : '')}
          </div>`).join('')}
        </div>
        <div class="sect">
          <div class="sect-h">design view</div>
          <div class="curie">${esc(n.designView ?? '(none — shared)')}</div>
        </div>
        ${compliance}
        ${(litProps.length || objProps.length) ? `<div class="sect">
          <div class="sect-h">properties</div>
          <table>
            ${objProps.map((p) => propRow(p, '→ ' + graph.links.filter((l) => (l.source.id ?? l.source) === n.id && l.property === p).map((l) => (typeof l.target === 'object' ? l.target.curie ?? l.target.id : l.target)).join(', '))).join('')}
            ${Object.entries(n.literals || {}).map(([k, v]) => propRow(k, v)).join('')}
          </table>
        </div>` : ''}
        ${mode === 'modelling' ? `<div class="sect"><div class="sect-h">rendered as</div><div class="curie">glyph: ${esc(n.glyph ?? n.shape)}</div></div>` : ''}
      `;
    }

    // Modelling's vocabulary catalog — the classes / object props / data props
    // ACTUALLY USED by the loaded model, each with its description. Click a term
    // to filter the graph to what it touches. Shown in the inspector when no node
    // is selected (and only in modelling mode).
    function renderCatalog() {
      const el = document.getElementById('inspector');
      if (mode !== 'modelling' || !graph) {
        el.innerHTML = '<p class="empty">Click a node to inspect it.</p>'; return;
      }
      const usedClasses = new Set(graph.nodes.flatMap((n) => n.types));
      const usedObjProps = new Set(graph.links.map((l) => l.property));
      const usedDataProps = new Set(graph.nodes.flatMap((n) => Object.keys(n.literals || {})));
      const section = (title, curies, act) => {
        const rows = [...curies].sort().map((c) => `
          <div class="term" data-term="${esc(c)}" data-act="${act}">
            <span class="tc">${esc(c)}</span>
            ${labelOf(c) ? `<span class="td">${esc(labelOf(c))}${descOf(c) ? ' — ' + esc(descOf(c)) : ''}</span>` : ''}
          </div>`).join('');
        return `<div class="cat-h">${title} (${curies.size})</div>${rows || '<div class="empty">(none)</div>'}`;
      };
      el.innerHTML = `<h2>Vocabulary</h2>
        <div class="curie">terms used in this model — click to isolate</div>
        ${section('classes', usedClasses, 'class')}
        ${section('object properties', usedObjProps, 'objprop')}
        ${section('data properties', usedDataProps, 'dataprop')}`;
      el.querySelectorAll('.term[data-term]').forEach((r) => r.addEventListener('click', () => {
        isolateTerm(r.dataset.term, r.dataset.act);
      }));
    }

    // Filter the graph to what a vocabulary term touches: a class → its nodes and
    // their links; an object property → its edges and endpoints; a data property
    // → the nodes carrying it. `All` resets.
    function isolateTerm(term, act) {
      let nodes, links;
      if (act === 'objprop') {
        links = graph.links.filter((l) => l.property === term);
        const ids = new Set(links.flatMap((l) => [l.source.id ?? l.source, l.target.id ?? l.target]));
        nodes = graph.nodes.filter((n) => ids.has(n.id));
      } else if (act === 'dataprop') {
        nodes = graph.nodes.filter((n) => term in (n.literals || {}));
        const ids = new Set(nodes.map((n) => n.id));
        links = graph.links.filter((l) => ids.has(l.source.id ?? l.source) && ids.has(l.target.id ?? l.target));
      } else {
        nodes = graph.nodes.filter((n) => n.types.includes(term));
        const ids = new Set(nodes.map((n) => n.id));
        links = graph.links.filter((l) => ids.has(l.source.id ?? l.source) && ids.has(l.target.id ?? l.target));
      }
      Graph.graphData({ nodes: nodes.map((n) => ({ ...n })), links: links.map((l) => ({ ...l })) });
      log(`isolate ${term} → ${nodes.length} node(s), ${links.length} link(s) — All resets`);
    }

    let currentNode = null;   // for re-inspect after a norm-selection change

    // Populate the colour dropdown for the active mode, show/hide the Norms
    // button, and keep colourMode valid (modelling never offers compliance).
    function syncModeUI() {
      const cm = document.getElementById('colour-mode');
      cm.innerHTML = COLOUR_OPTS[mode].map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('');
      if (!COLOUR_OPTS[mode].some(([v]) => v === colourMode)) colourMode = COLOUR_OPTS[mode][0][0];
      cm.value = colourMode;
      document.getElementById('norms').style.display = mode === 'designing' ? '' : 'none';
      document.getElementById('mode-select').value = mode;
    }

    const closeNorms = () => {
      document.getElementById('norms-modal').style.display = 'none';
      document.getElementById('modal-backdrop').style.display = 'none';
    };
    // The Designing picker: choose which norm editions the analysis runs against.
    // Non-compliance is only ever shown here (designing mode).
    function openNorms() {
      if (!report) return;
      const byNorm = {};
      for (const e of report.editions ?? []) (byNorm[e.norm] ??= []).push(e);
      const m = document.getElementById('norms-modal');
      m.innerHTML = `<h2>Norms &amp; good practices</h2>
        <p class="sub">Analyse the model against the selected editions. Deselecting a norm/edition
        drops it from the verdict — a node checked only by an excluded edition becomes unchecked,
        and a failure only under an excluded edition disappears.</p>
        ${Object.entries(byNorm).map(([norm, eds]) => `
          <div class="norm-h">${esc(norm)}</div>
          ${eds.map((e) => `<label class="ed">
            <input type="checkbox" data-ed="${esc(e.edition)}" ${selectedEditions.has(e.edition) ? 'checked' : ''}>
            ${esc(e.edition)} ${e.isLatest ? '<span class="inforce">(in force)</span>' : '<span class="td">(superseded)</span>'}
          </label>`).join('')}`).join('')}
        <div class="norm-h">good practices</div>
        <div class="empty">(none published yet — no norm carries dhc:normCategory "BestPractice")</div>
        <div class="actions">
          <button id="norms-all">Select all</button>
          <button id="norms-apply">Apply</button>
        </div>`;
      document.getElementById('modal-backdrop').style.display = 'block';
      m.style.display = 'block';
      m.querySelector('#norms-all').onclick = () => m.querySelectorAll('input[data-ed]').forEach((c) => { c.checked = true; });
      m.querySelector('#norms-apply').onclick = () => {
        selectedEditions = new Set([...m.querySelectorAll('input[data-ed]:checked')].map((c) => c.dataset.ed));
        closeNorms();
        hidden = new Set();
        renderLegend(); applyFilter();
        if (currentNode) inspect(currentNode);
        const full = selectedEditions.size === editionOrder.length;
        log(`analysing against ${full ? 'all editions' : [...selectedEditions].join(', ') || '(none — nothing checked)'}`);
      };
    }

    async function loadSource(slug) {
      hidden = new Set();
      hiddenKinds = new Set();
      const [g, r] = await Promise.all([
        fetchJson(`./data/${slug}.graph.json`),
        fetchJson(`./data/${slug}.report.json`),
      ]);
      graph = g; report = r;
      logEl.innerHTML = '';

      // Edition state for the Designing picker. editionOrder is oldest→newest
      // (report.editions is built in the runs order, which is depth-sorted).
      editionOrder = (r.editions ?? []).map((e) => e.edition);
      selectedEditions = new Set(editionOrder);          // default: analyse against all
      inForceByNorm = new Map();
      for (const e of r.editions ?? []) if (e.isLatest) inForceByNorm.set(e.norm, e.edition);

      log(`✓ ${g.source}`, 'ok');
      log(`✓ ${g.nodes.length} nodes, ${g.links.length} links (built ${g.generatedAt})`, 'ok');

      const circuits = g.nodes.filter((n) => n.types.includes('dhc:Circuit')).length;
      if (!g.nodes.length || !g.links.length) {
        log('✗ graph is EMPTY — nothing to validate. A failure, not an empty house.', 'err');
        setStatus('empty', 'error');
        return;
      }
      log(`✓ ${circuits} dhc:Circuit node(s) — shapes have focus nodes to select`, 'ok');
      log(`editions validated: ${(r.editions ?? []).map((e) => `${e.edition}${e.isLatest ? ' (in force)' : ''}`).join(' · ')}`);
      log(`shapes target: ${g.targetClasses.join(', ')}`);
      log(`compliance: ${g.tally.ok} ok · ${g.tally.gap} gap (passes an older edition, fails the current one) · ${g.tally.danger} danger · ${g.tally.unchecked} unchecked (no shape targets them) — ${g.tally.ghosted ?? 0} ghosted`,
          g.tally.danger ? 'warn' : 'info');
      log(`edges: ${Object.entries(g.edgeTally ?? {}).map(([k, v]) => `${v} ${k}`).join(' · ')}`);

      // Per-edition counts, never one aggregate. A violation under a SUPERSEDED
      // edition means the thing was never lawful; a violation under only the
      // CURRENT one means it is grandfathered. Same word, opposite meaning — so
      // a single "N violations" line would be actively misleading.
      for (const [ed, n] of Object.entries(r.violationsByEdition ?? {})) {
        const meta = (r.editions ?? []).find((e) => e.edition === ed);
        log(`  ${ed}${meta?.isLatest ? ' (in force)' : ' (superseded)'}: ${n} violation(s)`, n ? 'warn' : 'ok');
      }

      // What 'ok' is actually worth, per norm. If the edition in force has no
      // shapes, nothing under that norm can be proven current — those nodes are
      // ghosted rather than quietly green.
      for (const e of g.editionCoverage ?? []) {
        if (e.assessable) log(`${e.norm}: shapes for ${e.implements.join(' → ')} — the newest IS the edition in force, so "ok" is proven against current`, 'ok');
        else log(`⚠ ${e.norm}: shapes for ${e.implements.join(' → ')}, but ${e.latest ?? '(none)'} is in force and has no shapes — nothing under this norm can be proven current. Those nodes are ghosted: our gap, not the building's.`, 'warn');
      }

      // conforms = "no node is danger". A grandfathered circuit fails the
      // edition in force too, but that is lawful, not a defect — so the list
      // here is the DANGER nodes, not everything that fails the latest edition.
      // Rolling the two together is the conflation this whole model exists to
      // undo; the badge keeps them apart.
      const gapCount = g.tally.gap ?? 0;
      if (r.conforms) {
        log('⚠ conforms: true — no node is in danger. If this A-Box carries a deliberate defect, the chain is DEAD.', 'warn');
        setStatus('conforms', 'ok');
      } else {
        log(`✗ conforms: false — ${g.tally.danger} node(s) in danger (fails even the oldest edition, or fails the edition it claims):`, 'warn');
        for (const n of g.nodes.filter((n) => n.compliance === 'danger')) {
          log(`    ${n.curie}  ${n.complianceWhy ?? ''}`, 'err');
        }
        if (gapCount) log(`  (${gapCount} node(s) fail the edition in force but are grandfathered — lawful, not counted against conformance)`, 'info');
        setStatus(`${g.tally.danger} fail · ${gapCount} grandfathered`, 'warn');
      }

      collapsed = new Set();   // group membership is per-model
      computeGroups();
      applyFilter();           // group-aware: sets graphData + (re)builds hulls
      renderLegend();
      currentNode = null; inspect(null);   // modelling → vocab catalog; designing → prompt
      let fitted = false;
      const fit = () => { if (!fitted) { fitted = true; Graph.zoomToFit(600, 60); } };
      Graph.onEngineStop(fit);
      setTimeout(fit, 4000);
    }

    async function load() {
      try {
        log('Fetching generated artifacts…');
        const index = await fetchJson('./data/index.json');
        // vocab.json is one global file (dhc-core + overlay). Best-effort: the
        // catalog/descriptions degrade gracefully if it is absent.
        vocab = new Map((await fetchJson('./data/vocab.json').catch(() => ({ terms: [] }))).terms.map((t) => [t.curie, t]));

        // The graph instance is created once; switching source only swaps data.
        Graph = ForceGraph3D()(document.getElementById('graph-host'))
          .backgroundColor('#1e293b')
          .nodeId('id')
          .nodeLabel((n) => `${n.label}\n${n.curie}\n${n.compliance}: ${n.complianceWhy ?? ''}`)
          .nodeThreeObject(nodeObject)
          .linkColor((l) => styleOf(l).colour)
          .linkLabel((l) => `${l.property}  ·  ${l.kind}`)
          .linkWidth((l) => styleOf(l).width)
          .linkOpacity(0.5)
          .linkDirectionalArrowLength(2.5)
          .linkDirectionalArrowRelPos(1)
          // Flow and control are the edges where something travels; showing the
          // direction as motion rather than a static arrowhead is the whole
          // reason to be in 3-D for this.
          .linkDirectionalParticles((l) => styleOf(l).particles)
          .linkDirectionalParticleSpeed((l) => (l.kind === 'flow' ? 0.006 : 0.003))
          .linkDirectionalParticleThreeObject(particleObject)
          .onNodeClick((n) => { currentNode = n; inspect(n); })
          .onEngineTick(positionHulls);   // group hulls follow the live layout

        // Source picker — every A-Box in schema/abox/ is prebuilt, so switching
        // is a fetch, not a revalidation. Our own models sit at the top; the
        // external reference sets (schema/abox/<subfolder>/) are grouped under
        // their folder name, so 27 Brick samples don't bury the two that matter.
        const sel = document.getElementById('source-select');
        const opt = (s) => `<option value="${s.slug}">${s.label}${!s.reference && !s.conforms ? ` — ${s.violations}⚠` : ''}</option>`;
        const ours = index.sources.filter((s) => !s.reference);
        const groups = {};
        for (const s of index.sources.filter((s) => s.reference)) (groups[s.group] ??= []).push(s);
        sel.innerHTML = ours.map(opt).join('')
          + Object.entries(groups).map(([g, ss]) =>
              `<optgroup label="${g} — reference, not validated">${ss.map(opt).join('')}</optgroup>`).join('');
        const wanted = params.get('model');
        sel.value = index.sources.some((s) => s.slug === wanted) ? wanted : index.first;
        syncModeUI();
        document.getElementById('symbols').textContent = `symbols: ${glyphMode === 'sprite' ? 'flat' : '3-D'}`;
        document.getElementById('group-select').value = groupBy;
        sel.addEventListener('change', async (e) => {
          currentNode = null; inspect(null);
          await loadSource(e.target.value);
        });

        document.getElementById('mode-select').addEventListener('change', (e) => {
          mode = e.target.value;
          hidden = new Set();
          syncModeUI();
          renderLegend(); applyFilter();
          inspect(currentNode);   // catalog when nothing selected, node otherwise
          log(`mode → ${mode}${mode === 'modelling' ? ' (compliance hidden)' : ''}`);
        });

        document.getElementById('colour-mode').addEventListener('change', (e) => {
          colourMode = e.target.value;
          hidden = new Set();   // buckets differ per mode; a stale filter would hide the wrong things
          // applyFilter() re-sets graphData, which rebuilds every node object —
          // that is what picks up the new colour and the ghosting.
          renderLegend();
          applyFilter();
          log(`colour → ${colourMode}`);
        });

        document.getElementById('group-select').addEventListener('change', (e) => {
          groupBy = e.target.value;
          collapsed = new Set();   // a fresh grouping starts fully expanded
          computeGroups();
          renderLegend();
          applyFilter();           // rebuilds hulls; folds any collapsed groups
          log(`group → ${groupBy}${groupBy === 'none' ? '' : ` · ${groups.size} group(s)`}`);
        });

        document.getElementById('norms').addEventListener('click', openNorms);
        document.getElementById('modal-backdrop').addEventListener('click', closeNorms);
        document.getElementById('symbols').addEventListener('click', (e) => {
          glyphMode = glyphMode === 'solid' ? 'sprite' : 'solid';
          e.target.textContent = `symbols: ${glyphMode === 'sprite' ? 'flat' : '3-D'}`;
          applyFilter();   // re-sets graphData → rebuilds every node object
          log(`symbols → ${glyphMode === 'sprite' ? 'flat billboarded' : '3-D primitives'}`);
        });
        document.getElementById('fit').addEventListener('click', () => Graph.zoomToFit(600, 60));
        document.getElementById('reset-filter').addEventListener('click', () => {
          hidden = new Set(); hiddenKinds = new Set(); collapsed = new Set();
          renderLegend(); applyFilter();
        });

        await loadSource(sel.value);
        log(`${index.sources.length} model(s) available — switch with the "model" picker`);
        log('click a legend colour to filter');
      } catch (e) {
        log(String(e), 'err');
        setStatus('error', 'error');
        console.error(e);
      }
    }

    load();
  </script>
</body>
</html>
