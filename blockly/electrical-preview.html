<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DHC — Electrical Installation Designer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #020617;
      --bg-surface: #0f172a;
      --bg-panel:   #0f172a;
      --bg-raised:  #1e293b;
      --border:     rgba(148,163,184,0.18);
      --border-mid: rgba(148,163,184,0.3);
      --text-primary: #e2e8f0;
      --text-muted:   #64748b;
      --text-subtle:  #475569;

      --col-electrical: #3b82f6;
      --col-source:     #22c55e;
      --col-route:      #f59e0b;
      --col-sink:       #a855f7;
    }

    html, body { height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg-deep); color: var(--text-primary); -webkit-font-smoothing: antialiased; overflow: hidden; }

    /* ── Header ──────────────────────────────────────────────────────── */
    #header {
      height: 40px;
      background: rgba(15,23,42,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-mid);
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
      flex-shrink: 0; position: relative; z-index: 40;
    }
    #header .logo {
      width: 26px; height: 26px; border-radius: 6px;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff; font-size: 12px; flex-shrink: 0;
    }
    #header .brand { display: flex; flex-direction: column; gap: 1px; }
    #header .brand-title { font-size: 11px; font-weight: 700; color: var(--text-primary); }
    #header .brand-sub   { font-size: 9px; color: var(--text-muted); font-family: ui-monospace, Menlo, monospace; }

    #header .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

    #header label { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    #header select {
      font: 10px system-ui; background: var(--bg-raised); color: var(--text-primary);
      border: 1px solid var(--border-mid); border-radius: 4px; padding: 2px 6px;
      cursor: pointer; outline: none;
    }
    #header select:focus { border-color: var(--col-electrical); }

    .hbtn {
      padding: 3px 10px; font-size: 10px; font-weight: 500; border-radius: 99px;
      cursor: pointer; border: 1px solid var(--border-mid);
      background: transparent; color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .hbtn:hover { background: var(--bg-raised); color: var(--text-primary); }
    .hbtn.primary { color: #bfdbfe; background: rgba(37,99,235,0.15); border-color: rgba(59,130,246,0.5); }
    .hbtn.primary:hover { background: rgba(37,99,235,0.28); }

    #header .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

    #status {
      font-size: 9px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
      letter-spacing: 0.04em;
    }
    #status.loading { background: rgba(100,116,139,0.2); color: #94a3b8; }
    #status.ok      { background: rgba(34,197,94,0.15);  color: #4ade80; }
    #status.error   { background: rgba(239,68,68,0.15);  color: #f87171; }

    /* ── Tab bar ─────────────────────────────────────────────────────── */
    #tabs {
      height: 32px; background: rgba(15,23,42,0.85);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-end; padding: 0 10px; flex-shrink: 0;
    }
    .tab {
      padding: 0 10px 5px; font-size: 10px; font-weight: 400;
      cursor: pointer; color: var(--text-subtle);
      border-bottom: 2px solid transparent;
      display: flex; align-items: center; gap: 5px;
      background: none; border-top: none; border-left: none; border-right: none;
      transition: color 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .tab:hover { color: var(--text-primary); }
    .tab.active { color: var(--text-primary); font-weight: 600; }
    .tab .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

    /* ── Layout ──────────────────────────────────────────────────────── */
    #layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 72px); }
    #blockly-host { flex: 1; position: relative; overflow: hidden; }

    /* ── Right panel ─────────────────────────────────────────────────── */
    #right-panel {
      width: 240px; border-left: 1px solid var(--border);
      background: var(--bg-panel); display: flex; flex-direction: column;
      flex-shrink: 0; overflow: hidden;
    }
    #right-panel .panel-title {
      padding: 8px 10px 6px; font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-subtle);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #log {
      flex: 1; overflow-y: auto; padding: 6px 8px;
      font: 10px/1.5 ui-monospace, Menlo, Consolas, monospace;
    }
    #log::-webkit-scrollbar { width: 3px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: var(--bg-raised); border-radius: 2px; }
    .log-line { white-space: pre-wrap; margin-bottom: 1px; }
    .log-line.info { color: var(--text-muted); }
    .log-line.ok   { color: #4ade80; }
    .log-line.err  { color: #f87171; }
    .log-line.evt  { color: #93c5fd; }

    #stats {
      border-top: 1px solid var(--border); padding: 6px 10px;
      display: flex; flex-direction: column; gap: 3px; flex-shrink: 0;
    }
    .stat-row { display: flex; justify-content: space-between; align-items: center; }
    .stat-label { font-size: 9px; color: var(--text-subtle); }
    .stat-value { font-size: 10px; font-weight: 600; color: var(--text-primary); font-family: ui-monospace, Menlo, monospace; }

    /* ── Blockly toolbox overrides ───────────────────────────────────── */
    .blocklyToolboxDiv {
      background: var(--bg-surface) !important;
      border-right: 1px solid var(--border) !important;
      padding-top: 4px !important;
    }
    .blocklyTreeRow { border-radius: 0 !important; }
    .blocklyTreeRow:hover { background: rgba(148,163,184,0.07) !important; }
    .blocklyTreeSelected { background: rgba(148,163,184,0.12) !important; }
    .blocklyTreeLabel {
      font-family: system-ui, -apple-system, sans-serif !important;
      font-size: 11px !important; font-weight: 500 !important;
      padding: 4px 6px !important; color: #cbd5e1 !important; letter-spacing: 0.01em !important;
    }
    .blocklyFlyoutBackground { fill: #0c1628 !important; }
    .blocklyScrollbarBackground { fill: transparent !important; }
    .blocklyScrollbarHandle { fill: #334155 !important; rx: 3px !important; }
    .blocklyMainBackground { fill: #0d1929 !important; }
    .blocklyGrid line { stroke: rgba(51,65,85,0.7) !important; }
    .blocklyZoom > image, .blocklyTrash > image { filter: invert(0.7) !important; }
  </style>

  <!-- Blockly v11 — CDN (this harness is NOT offline; see blockly/README.md) -->
  <script src="https://unpkg.com/blockly@11.2.2/blockly.min.js"></script>
  <!-- DHC mutators — must load AFTER Blockly, BEFORE block defs -->
  <script src="./registerPlugins.js"></script>
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────────────────── -->
  <header id="header">
    <div class="logo">⚡</div>
    <div class="brand">
      <div class="brand-title">Electrical Installation Designer</div>
      <div class="brand-sub" id="install-name">Power Distribution System</div>
    </div>
    <div class="divider"></div>
    <label>
      Renderer
      <select id="renderer-select">
        <option value="thrasos">thrasos</option>
        <option value="geras">geras</option>
        <option value="zelos">zelos</option>
        <option value="minimalist">minimalist</option>
      </select>
    </label>
    <div class="right">
      <button class="hbtn" id="btn-clear" title="Clear workspace">Clear</button>
      <button class="hbtn" id="btn-json"  title="View workspace JSON">View JSON</button>
      <button class="hbtn primary" id="btn-save" title="Download workspace JSON">Save</button>
      <div class="divider"></div>
      <span id="status" class="status loading">loading…</span>
    </div>
  </header>

  <!-- ── View tabs ─────────────────────────────────────────────────────── -->
  <div id="tabs">
    <button class="tab active" data-view="All">All</button>
    <button class="tab" data-view="Sources"><span class="dot" style="background: var(--col-source)"></span>Sources</button>
    <button class="tab" data-view="Routing"><span class="dot" style="background: var(--col-route)"></span>Routing</button>
    <button class="tab" data-view="Sinks"><span class="dot" style="background: var(--col-sink)"></span>Sinks</button>
  </div>

  <!-- ── Main layout ──────────────────────────────────────────────────── -->
  <div id="layout">
    <div id="blockly-host"></div>

    <aside id="right-panel">
      <div class="panel-title">Event Log</div>
      <div id="log"></div>
      <div id="stats">
        <div class="stat-row"><span class="stat-label">Blocks</span><span class="stat-value" id="stat-blocks">0</span></div>
        <div class="stat-row"><span class="stat-label">Top-level</span><span class="stat-value" id="stat-top">0</span></div>
        <div class="stat-row"><span class="stat-label">Renderer</span><span class="stat-value" id="stat-renderer">—</span></div>
      </div>
    </aside>
  </div>

  <script>
  (function () {

    /* ── Tab → toolbox category mapping ─────────────────────────────────
     * "Start" (the root block) is always shown so the installation root is
     * reachable from every tab. */
    const TAB_COLORS = { Sources: '#22c55e', Routing: '#f59e0b', Sinks: '#a855f7' };
    const VIEW_CATS = {
      All:     ['Start', 'Sources', 'Routing', 'Sinks'],
      Sources: ['Start', 'Sources'],
      Routing: ['Start', 'Routing'],
      Sinks:   ['Start', 'Sinks'],
    };

    /* ── DHC electrical theme ───────────────────────────────────────────
     * Blocks carry their own explicit colour, so only the component styles
     * (workspace/toolbox chrome) matter here. */
    const DHC_THEME = Blockly.Theme.defineTheme('dhc-electrical', {
      base: Blockly.Themes.Classic,
      categoryStyles: {
        start_category:   { colour: '#3b82f6' },
        sources_category: { colour: '#22c55e' },
        routing_category: { colour: '#f59e0b' },
        sinks_category:   { colour: '#a855f7' },
      },
      componentStyles: {
        workspaceBackgroundColour:  '#0d1929',
        toolboxBackgroundColour:    '#0f172a',
        toolboxForegroundColour:    '#cbd5e1',
        flyoutBackgroundColour:     '#0c1628',
        flyoutForegroundColour:     '#94a3b8',
        flyoutOpacity:              1,
        scrollbarColour:            '#334155',
        scrollbarOpacity:           0.6,
        insertionMarkerColour:      '#3b82f6',
        insertionMarkerOpacity:     0.5,
        markerColour:               '#3b82f6',
        cursorColour:               '#3b82f6',
      },
      fontStyle: { family: 'system-ui, -apple-system, sans-serif', weight: '500', size: 11 },
    });

    /* ── Logging ────────────────────────────────────────────────────── */
    const logEl      = document.getElementById('log');
    const statusEl   = document.getElementById('status');
    const statBlocks = document.getElementById('stat-blocks');
    const statTop    = document.getElementById('stat-top');
    const statRend   = document.getElementById('stat-renderer');

    function log(msg, cls = 'info') {
      const d = document.createElement('div');
      d.className = 'log-line ' + cls;
      const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
      d.textContent = ts + '  ' + msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
    }
    function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + cls; }

    async function fetchJson(path) {
      const r = await fetch(path);
      if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
      return r.json();
    }

    /* ── Renderer + view persistence ────────────────────────────────── */
    const RENDERER_KEY    = 'dhc.blockly.electrical.renderer';
    const VALID_RENDERERS = ['thrasos','geras','zelos','minimalist'];
    function getRenderer() {
      const s = localStorage.getItem(RENDERER_KEY);
      return VALID_RENDERERS.includes(s) ? s : 'thrasos';
    }
    const VIEW_KEY = 'dhc.blockly.electrical.view';
    let activeView = localStorage.getItem(VIEW_KEY) || 'All';

    /* ── State ──────────────────────────────────────────────────────── */
    let workspace   = null;
    let fullToolbox = null;
    let blockDefs   = null;

    function buildToolboxForView(view) {
      const cats = VIEW_CATS[view] || VIEW_CATS['All'];
      return {
        kind: 'categoryToolbox',
        contents: (fullToolbox.contents || []).filter(c => cats.includes(c.name)),
      };
    }

    function updateStats() {
      if (!workspace) return;
      statBlocks.textContent = workspace.getAllBlocks(false).length;
      statTop.textContent    = workspace.getTopBlocks(false).length;
    }

    function injectWorkspace(renderer, restoreState) {
      if (workspace) {
        if (!restoreState) restoreState = Blockly.serialization.workspaces.save(workspace);
        workspace.dispose();
        workspace = null;
      }
      workspace = Blockly.inject('blockly-host', {
        toolbox:  buildToolboxForView(activeView),
        renderer: renderer,
        theme:    DHC_THEME,
        grid: { spacing: 28, length: 4, colour: 'rgba(51,65,85,0.5)', snap: true },
        zoom: { controls: true, wheel: true, startScale: 0.9, maxScale: 2.5, minScale: 0.4, scaleSpeed: 1.1 },
        trashcan: true,
        move: { scrollbars: true, drag: true, wheel: false },
      });

      if (restoreState) {
        try { Blockly.serialization.workspaces.load(restoreState, workspace); }
        catch (e) { log('⚠ workspace restore: ' + e.message, 'err'); }
      }

      workspace.addChangeListener((ev) => {
        if (ev.isUiEvent) return;
        if (ev.type === Blockly.Events.BLOCK_CREATE)      log('+ ' + (ev.json?.type || ev.blockId), 'ok');
        else if (ev.type === Blockly.Events.BLOCK_DELETE) log('− ' + (ev.oldJson?.type || ev.blockId), 'info');
        else if (ev.type === Blockly.Events.BLOCK_CHANGE) log('~ ' + ev.blockId + '.' + ev.name + ' = ' + JSON.stringify(ev.newValue), 'evt');
        else if (ev.type === Blockly.Events.BLOCK_MOVE)   log('→ moved ' + ev.blockId, 'info');
        updateStats();
      });

      statRend.textContent = renderer;
      updateStats();
      log('✓ renderer: ' + renderer, 'ok');
    }

    function setActiveView(view) {
      activeView = view;
      localStorage.setItem(VIEW_KEY, view);
      document.querySelectorAll('.tab').forEach(btn => {
        const isActive = btn.dataset.view === view;
        btn.classList.toggle('active', isActive);
        const color = TAB_COLORS[view] || '#3b82f6';
        btn.style.borderBottomColor = isActive ? color : 'transparent';
      });
      if (workspace) {
        workspace.updateToolbox(buildToolboxForView(view));
        log('view → ' + view, 'info');
      }
    }
    document.querySelectorAll('.tab').forEach(btn =>
      btn.addEventListener('click', () => setActiveView(btn.dataset.view)));
    setActiveView(activeView);

    function currentJson() {
      return JSON.stringify(Blockly.serialization.workspaces.save(workspace), null, 2);
    }

    document.getElementById('btn-json').addEventListener('click', () => {
      const text = currentJson();
      const url  = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      const w    = window.open(url, '_blank');
      if (!w) log('✗ popup blocked', 'err');
      else    log('↗ opened JSON in new tab (' + text.length + ' chars)', 'ok');
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      const text  = currentJson();
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const fname = 'dhc-electrical-' + stamp + '.json';
      const url   = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a     = Object.assign(document.createElement('a'), { href: url, download: fname });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5_000);
      log('↓ saved ' + fname, 'ok');
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      if (workspace) { workspace.clear(); updateStats(); log('workspace cleared', 'info'); }
    });

    const rendSelect = document.getElementById('renderer-select');
    rendSelect.value = getRenderer();
    rendSelect.addEventListener('change', (e) => {
      const r = e.target.value;
      if (!VALID_RENDERERS.includes(r)) return;
      localStorage.setItem(RENDERER_KEY, r);
      log('switching → ' + r + '…');
      injectWorkspace(r);
    });

    async function load() {
      try {
        log('loading artifacts…');
        const [blocksDoc, toolbox, workspaceState] = await Promise.all([
          fetchJson('./electrical-blocks.json'),
          fetchJson('./electrical-toolbox.json'),
          fetchJson('./electrical-workspace.json'),
        ]);

        blockDefs   = blocksDoc.blocks || [];
        fullToolbox = toolbox;

        log('blocks.json  → ' + blockDefs.length + ' defs', 'ok');
        log('toolbox.json → ' + (toolbox.contents || []).length + ' categories', 'ok');

        Blockly.defineBlocksWithJsonArray(blockDefs);
        log('registered: ' + blockDefs.map(b => b.type).join(', '), 'ok');

        const renderer = getRenderer();
        rendSelect.value = renderer;
        injectWorkspace(renderer, workspaceState);
        setActiveView(activeView);

        setStatus('ready', 'ok');
        const root = workspaceState?.blocks?.blocks?.[0]?.fields?.name;
        if (root) document.getElementById('install-name').textContent = root;

      } catch (e) {
        log(String(e), 'err');
        setStatus('error', 'error');
        console.error(e);
      }
    }

    load();
  })();
  </script>
</body>
</html>
